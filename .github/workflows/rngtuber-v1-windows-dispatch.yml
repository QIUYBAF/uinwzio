name: RNGtuber V1 Windows dispatch

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/rngtuber-v1-windows-dispatch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rngtuber:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rngtuber-v1-modular-2026-08-29
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test render and build
        shell: pwsh
        working-directory: RNGtuber_V1_Modular_2026-08-29
        run: ./build_windows.ps1
      - name: Preserve verified previews
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "RNGtuber_V1_Modular_2026-08-29/reports"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Render verified RNGtuber v1.1 previews [skip ci]"
            git push origin HEAD:rngtuber-v1-modular-2026-08-29
          }
      - name: Upload release and previews
        uses: actions/upload-artifact@v4
        with:
          name: RNGtuber_V1_Windows_and_previews
          path: |
            RNGtuber_V1_Modular_2026-08-29/release/RNGtuber_V1_Windows.zip
            RNGtuber_V1_Modular_2026-08-29/release/RNGtuber_V1_Windows.zip.sha256
            RNGtuber_V1_Modular_2026-08-29/reports/previews/*.gif
            RNGtuber_V1_Modular_2026-08-29/reports/previews/*.png
          if-no-files-found: error
          retention-days: 14
