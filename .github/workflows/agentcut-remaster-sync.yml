name: AgentCut Remaster Runtime Sync

on:
  push:
    branches: [agentcut-remaster-sync]
    paths:
      - 'AgentCut/.runtime_sync/READY'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agentcut-remaster-sync
          fetch-depth: 0
      - name: Reconstruct runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          cat AgentCut/.runtime_sync/part-* > /tmp/agentcut_runtime.b64
          base64 -d /tmp/agentcut_runtime.b64 > /tmp/agentcut_runtime.tgz
          mkdir -p /tmp/agentcut_runtime
          tar -xzf /tmp/agentcut_runtime.tgz -C /tmp/agentcut_runtime
          rsync -a --delete --exclude='.runtime_sync' /tmp/agentcut_runtime/ AgentCut/
          rm -rf AgentCut/.runtime_sync
          rm -f .github/workflows/agentcut-remaster-sync.yml
      - name: Validate source shape
        shell: bash
        run: |
          set -euo pipefail
          test -f AgentCut/pyproject.toml
          test -f AgentCut/agentcut/editor.py
          test -f AgentCut/agentcut/render.py
          test -f AgentCut/agentcut/cli.py
          test -f AgentCut/agentcut.manifest.json
          python -m compileall -q AgentCut/agentcut
      - name: Commit synchronized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A AgentCut .github/workflows/agentcut-remaster-sync.yml
          git commit -m 'chore(agentcut): synchronize complete 1.0.0 Remaster runtime'
          git push origin HEAD:agentcut-remaster-sync
