name: RNGtuber bootstrap and Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - rngtuber-v1-modular-2026-08-29
    paths:
      - bootstrap/checkpoint_02_RNGtuber_V1_Modular_refined_assets_2026-08-29.zip
      - .github/workflows/rngtuber-bootstrap-windows.yml

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract validated Drive checkpoint
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "bootstrap/checkpoint_02_RNGtuber_V1_Modular_refined_assets_2026-08-29.zip" -DestinationPath "." -Force
          $buildPath = "RNGtuber_V1_Modular_2026-08-29/build_windows.ps1"
          $buildText = Get-Content -LiteralPath $buildPath -Raw
          $buildText = $buildText -replace '(?m)^& \$VenvPython tools\\prepare_assets\.py\r?\n', ''
          Set-Content -LiteralPath $buildPath -Value $buildText -Encoding UTF8

      - name: Preserve extracted source on branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "RNGtuber_V1_Modular_2026-08-29"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Import runnable RNGtuber checkpoint 02 source [skip ci]"
            git push origin HEAD:rngtuber-v1-modular-2026-08-29
          }

      - name: Build and smoke-test Windows release
        shell: pwsh
        working-directory: RNGtuber_V1_Modular_2026-08-29
        run: ./build_windows.ps1

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RNGtuber_V1_Windows
          path: |
            RNGtuber_V1_Modular_2026-08-29/release/RNGtuber_V1_Windows.zip
            RNGtuber_V1_Modular_2026-08-29/release/RNGtuber_V1_Windows.zip.sha256
          if-no-files-found: error
          retention-days: 14
