[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcut"
version = "1.0.0"
description = "Agent-native semantic video editing runtime remastered for low-friction Codex and ChatGPT Work use."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "Pillow>=10.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
agentcut = "agentcut.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentcut*"]

[tool.setuptools.package-data]
"agentcut.data.libraries" = ["*.json"]
